# Dummy profile so `dbt parse` can run in CI without credentials (parse never connects).
db_trade_platform:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: ci_account
      user: ci_user
      password: ci_password
      role: ci_role
      warehouse: ci_wh
      database: DB_TRADE_DB
      schema: STANDARD
      threads: 1
